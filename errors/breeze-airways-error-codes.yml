transport_failures:
- symptom: Connect ETIMEDOUT
  cause: The calling IP address is not allowlisted on the Breeze NDC gateway.
  remediation: Call from an allowlisted host, or ask Breeze to update the allowlist.
- symptom: HTTP 401 Access Denied with WWW-Authenticate AzureApiManagementKey
  cause: Missing, stale or incorrect Ocp-Apim-Subscription-Key.
  remediation: Provide a valid subscription key for the environment being called.
- symptom: HTTP 404 resource not found / unable to connect to server
  cause: Requests sent to the decommissioned test environment ndc.test.mx.navitaire.com.
  remediation: Move to ndcr4y.test.mx.navitaire.com and use the reissued subscription key.
  source: https://ndc.flybreeze.com/news/new-breeze-ndc-test-environment-2025-08-27
