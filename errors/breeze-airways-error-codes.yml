docs: https://ndc.flybreeze.com/docs/ndc-for-developers/general-ndc-errors
api: Breeze Airways NDC Gateway
format: iata-ndc-errors
rfc9457: false
envelope:
  description: >-
    Errors are returned inside the IATA NDC response payload as Errors/Error
    elements. More than one Error element can appear in a single response. Gateway
    and reservation-system failures are additionally surfaced on HTTP response
    headers.
  body_elements:
  - name: TypeCode
    description: The Breeze/Navitaire error code identifier.
    required: true
  - name: DescText
    description: A description of the error encountered and suggested remedial steps.
    required: false
  - name: LangCode
    description: Language of DescText. Always returned as "en".
    required: true
  header_fields:
  - name: Error-Code-0
    description: Error code returned on the HTTP response headers (indexed, 0-based).
  - name: Error-Msg-0
    description: Human readable error message returned on the HTTP response headers.
  - name: WWW-Authenticate
    description: Returned as AzureApiManagementKey on a 401 subscription-key failure.
error_classes:
- prefix: CF
  area: Configuration / authentication
- prefix: AS
  area: AirShopping
- prefix: AP
  area: AirlineProfile
errors:
- code: CF4000
  area: authentication
  title: Authentication failure
  description: The configured system user or anonymous user failed authentication.
  variants:
  - message: 'Unable to find best role for agent…'
    http_status: 500
    cause: The role code defined in the URL does not match the key provided in the Authorization token.
    remediation: Correct the role parameter value, or remove the parameter from the authentication request.
  - message: 'Unable to decode credentials. Please ensure correct format.'
    http_status: 500
    cause: No Authorization header provided, or an invalid key was provided.
    remediation: Provide valid credentials.
  - message: 'The agent [*agent name*] is locked.'
    http_status: 500
    cause: Multiple invalid login credential attempts, or Breeze initiated an agent lock.
    remediation: Contact Breeze to request an agent unlock.
