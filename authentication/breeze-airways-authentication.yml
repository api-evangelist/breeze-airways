onboarding:
  prerequisites:
  - IATA or ARC agency number
  - Executed commercial agreement (agreement in principle accepted for sandbox access)
  - Declared agency content type (leisure, business/corporate, or federal government)
  - List of egress IP addresses for sandbox and production allowlisting
  credential_delivery: https://send.bitwarden.com
  ip_allowlist_sla: requests to allow additional IPs are typically fulfilled within one week
  source: https://ndc.flybreeze.com/docs/ndc-for-developers/getting-started
