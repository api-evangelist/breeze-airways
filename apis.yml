apis:
- aid: breeze-airways-ndc-gateway
  name: Breeze Airways NDC Gateway
  description: 'The Breeze Airways NDC gateway is the airline''s direct-connect distribution
    API for accredited travel partners. It speaks IATA Offers and Orders (NDC) 21.3
    XML over HTTPS on a Navitaire-hosted gateway, split into three route families:
    Shopping (AirlineProfile, AirShopping), Selling (Auth, OfferPrice, ServiceList,
    SeatAvailability, OrderCreate) and Servicing (OrderRetrieve, OrderQuote, OrderReshop,
    OrderChange, ServiceList, SeatAvailability). Every request carries an Ocp-Apim-Subscription-Key
    header; all routes except AirShopping additionally require a session bearer token
    obtained from the Auth endpoint with grant_type=client_credentials. Calling IPs
    must be explicitly allowlisted by Breeze for the sandbox or production environment.'
  humanURL: https://ndc.flybreeze.com/docs/category/ndc-for-developers
  baseURL: https://ndcr4y.prod.mx.navitaire.com
  image: https://ndc.flybreeze.com/img/breeze-b2b-social-card.jpg
  tags:
  - NDC
  - Airlines
  - Booking
  - Reservations
  - Travel
  x-evidence:
    fetched: '2026-08-01'
    baseURL_source: https://ndc.flybreeze.com/docs/ndc-for-developers/authentication
    baseURL_note: 'Production host taken from the iss claim (ndcr4y.prod.mx.navitaire.com)
      of the sample production bearer token published on the Breeze authentication
      docs page; the gateway is IP-allowlisted so it is not anonymously reachable
      (TCP connect fails, DNS resolves to 172.175.233.85).'
    sandbox_host: ndcr4y.test.mx.navitaire.com
    sandbox_source: https://ndc.flybreeze.com/news/new-breeze-ndc-test-environment-2025-08-27
