aid: breeze-airways
name: Breeze Airways
description: 'Breeze Airways (Breeze Aviation Group, Inc.) is an American low-cost
  point-to-point airline headquartered in Cottonwood Heights, Utah, founded by David
  Neeleman and flying since May 2021. Its distribution technology surface is a partner-facing
  IATA NDC gateway, documented at the Breeze B2B portal (ndc.flybreeze.com), which
  exposes IATA Offers and Orders 21.3 XML messages — AirlineProfile, AirShopping,
  OfferPrice, ServiceList, SeatAvailability and OrderCreate for shopping and selling,
  plus OrderRetrieve, OrderQuote, OrderReshop and OrderChange for servicing — over
  a Navitaire-hosted, IP-allowlisted gateway secured with a per-partner Azure API
  Management subscription key and a 30-minute session bearer token. Access is limited
  to accredited travel-agency partners (OTA, TMC and US federal government) with an
  IATA/ARC number and an executed commercial agreement; Breeze also distributes over
  Amadeus and Travelport GDS and via the TravelPro agent booking portal.'
