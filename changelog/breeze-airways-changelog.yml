  title: Remove individual flights with OrderReshop
  url: https://ndc.flybreeze.com/news/orderReshop-flows-added-2025-09-25
  tags: [ndc]
  type: addition
  breaking: false
  highlights:
  - OrderReshop documentation expanded; partners can release unpaid inventory and remove individual flights.
  - Full order cancellation supported via the CancelOrderRef node referencing a mandatory OrderRefID.
  - Partial cancellation supported via the DeleteOrderItem node referencing OrderItemRefID.
  - 'Limitation: penalties and spoilage disclosed in fare rules cannot be applied during an OrderReshop session; refunds or travel credit are processed by an automated worker after OrderChange, and any credit appears on a subsequent OrderRetrieve response.'
